<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Hub 🚀</title>
    <link rel="stylesheet" href="css/hub.css">
</head>
<body>
    <section class="hub-hero">
        <h1>🚀 Project Hub</h1>
        <p>揀一個 project 去睇 👇</p>
    </section>

    <section class="projects">
        <div class="projects-grid">
            <!-- Project 1: Phuket Trip -->
            <a href="phuket/" class="project-card">
                <span class="project-icon">🌴</span>
                <h3>Phuket Trip 2026</h3>
                <p>布吉親子之旅完整行程計劃，包含每日行程、地圖連結、行李清單同預算一覽。</p>
                <div class="project-tags">
                    <span class="project-tag">HTML/CSS</span>
                    <span class="project-tag green">Travel</span>
                    <span class="project-tag yellow">已完成</span>
                </div>
            </a>

            <!-- 未來 project 放呢度 -->
        </div>

        <div class="empty-state">
            <div class="empty-icon">📂</div>
            <h3>仲有更多 project 緊接而來</h3>
            <p>新项目會自動出現喺呢個 grid 上面</p>
        </div>
    </section>

    <footer class="hub-footer">
        Project Hub · 每個項目獨立部署，互不影響
    </footer>
</body>
</html>
